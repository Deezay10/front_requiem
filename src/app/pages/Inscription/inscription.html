<div class="uk-section uk-section-muted uk-flex uk-flex-middle uk-animation-fade" uk-height-viewport>
  <div class="uk-width-1-1">
    <div class="uk-container">
      <div class="uk-grid-margin uk-grid uk-grid-stack" uk-grid>
        <div class="uk-width-1-1@m">
          <div class="uk-margin uk-width-large uk-margin-auto uk-card uk-card-default uk-card-body uk-box-shadow-large">

            <h3 class="uk-card-title uk-text-center">Créez votre compte</h3>

            <form (ngSubmit)="register()" #form="ngForm">

              <!-- Email -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="mail"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.email" name="email" type="email" placeholder="Email" required>
                </div>
              </div>

              <!-- Mot de passe -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="lock"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.motdepasse" name="motDePasse" type="password" placeholder="Mot de passe" required>
                </div>
              </div>

              <!-- Confirmation du Mot de passe -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="lock"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.confirmationmotdepasse" name="confirmationMotDePasse" type="password" placeholder="Confirmation du mot de passe" required>
                </div>
                <!-- Message d'erreur juste sous le champ -->
                <p *ngIf="mdpdifferent" class="uk-text-danger uk-text-small uk-margin-small-top">{{ message }}</p>
              </div>

              <!-- Nom -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="user"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.nom" name="Nom" type="text" placeholder="Nom">
                </div>
              </div>

              <!-- Prénom -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="user"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.prenom" name="Prénom" type="text" placeholder="Prénom">
                </div>
              </div>

              <!-- Adresse -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="home"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.adresse" name="Adresse" type="text" placeholder="Adresse">
                </div>
              </div>

              <!-- Mobile -->
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="receiver"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="user.mobile" name="Mobile" type="text" placeholder="Mobile">
                </div>
              </div>

              <!-- Envoyer -->
              <div class="uk-margin">
                <button
                  type="submit"
                  class="uk-button uk-button-primary uk-button-large uk-width-1-1">
                  S'inscrire
                </button>
              </div>

              <div class="uk-text-small uk-text-center">
                Vous avez déjà un compte ? <a class="uk-link" href="connexion">Connectez-vous</a>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
