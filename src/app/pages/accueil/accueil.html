<div class="dashboard-wrapper">
  <header class="uk-text-center uk-margin-bottom">
    <h1 class="welcome-text">Bonjour <span>{{user?.prenom}}</span></h1>
  </header>

  <div class="dashboard-outer-shell">
    <div class="dashboard-main-grid">

      <!-- ══ IA CHAT ══ -->
      <div class="accueil-container">
        <!-- Ton contenu habituel -->

        <!-- La zone de chat que tu veux garder -->
        <div class="chat-container">
          <div class="chat-window">
            <div *ngFor="let msg of messages" [ngClass]="{'user-msg': msg.isUser, 'bot-msg': !msg.isUser}">
              {{ msg.text }}
            </div>
          </div>

          <div class="chat-input">
            <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Écrivez ici...">
            <button (click)="sendMessage()">Envoyer</button>
          </div>
        </div>
      </div>

      <!-- ══ PLANTES ══ -->
      <div class="card card-plants uk-card uk-card-body">
        <div class="plants-card-header">
          <h3 class="uk-card-title">État des plantes</h3>
          <a class="plants-add-btn" href="/ajout_plante">+ Ajouter</a>
        </div>
        <div class="widget-content plants-list">
          <div class="plant-item" *ngFor="let legume of legumes"
               [ngClass]="{ 'plant-item-active': selectedLegume?.id === legume.id }"
               (click)="selectionnerPlante(legume)">
            <img class="plant-thumb" [src]="legume.image_url" [alt]="legume.nom" />
            <div class="plant-info">
              <p class="plant-name">{{ legume.nom }}</p>
              <p class="plant-meta">{{ liste_saison[legume.id] }} · {{ legume.croissance_jours }}j</p>
            </div>
            <div class="plant-right">
              <span class="plant-etat etat-ok">{{ legume.etat }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ MAP & HA ══ -->
      <div class="right-stack">
        <div class="card card-map uk-card uk-card-body">
          <h3 class="uk-card-title">Map</h3>
          <div class="external-wrapper">
            <iframe [src]="link" width="100%" height="100%" style="border:0;" allowfullscreen loading="lazy"></iframe>
          </div>
        </div>
        <div class="card card-ha uk-card uk-card-body">
          <h3 class="uk-card-title">Capteurs Home Assistant</h3>
          <div class="external-wrapper"></div>
        </div>
      </div>

    </div>
  </div>
</div>
