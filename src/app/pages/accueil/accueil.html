<div class="dashboard-wrapper">
  <br>
  <!-- Le titre est maintenant en dehors de la shell grise -->
  <header class="uk-text-center uk-margin-bottom">
    <h1 class="welcome-text">Bonjour <span>User</span></h1>
  </header>

  <!-- Le container gris devient le "cadre" réduit -->
  <div class="dashboard-outer-shell">
    <div class="uk-container uk-container-expand">
      <div class="dashboard-main-grid">

        <!-- IA -->
        <div class="card card-ia uk-card uk-card-default uk-card-body">
          <h3 class="uk-card-title">IA</h3>
          <div class="widget-content">

          </div>
        </div>

        <!-- Plantes -->
        <div class="card card-plants uk-card uk-card-default uk-card-body">
          <h3 class="uk-card-title">État des plantes</h3>
          <div class="widget-content"></div>
        </div>

        <!-- Stack de droite (Map + HA) -->
        <div class="right-stack">
          <div class="card card-map uk-card uk-card-default uk-card-body">
            <h3 class="uk-card-title">Map</h3>
            <div class="external-wrapper"></div>
          </div>

          <div class="card card-ha uk-card uk-card-default uk-card-body">
            <h3 class="uk-card-title">Capteurs Home Assistant</h3>
            <div class="external-wrapper"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
