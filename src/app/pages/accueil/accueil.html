<div class="dashboard-wrapper uk-container uk-container-expand">
  <!-- En-tête -->
  <div class="uk-text-center uk-margin-large-bottom">
    <h1 class="uk-heading-medium">Bonjour <span class="user-name">User</span></h1>
  </div>

  <!-- Grille du Dashboard -->
  <div class="dashboard-grid">
    <!-- Zone IA -->
    <div class="card-ia uk-card uk-card-default uk-card-body uk-border-rounded">
      <h3 class="uk-card-title">IA</h3>
      <p>Interface de contrôle...</p>
    </div>

    <!-- Liste Plantes -->
    <div class="card-plants uk-card uk-card-default uk-card-body uk-border-rounded">
      <h3 class="uk-card-title">État des plantes</h3>
      <p>Suivi en temps réel...</p>
    </div>

    <!-- Map -->
    <div class="card-map uk-card uk-card-default uk-card-body uk-border-rounded">
      <h3 class="uk-card-title">Map</h3>
      <div class="map-placeholder">Position des capteurs</div>
    </div>

    <!-- Home Assistant -->
    <div class="card-ha uk-card uk-card-default uk-card-body uk-border-rounded">
      <h3 class="uk-card-title">Home Assistant</h3>
      <p>Capteurs actifs</p>
    </div>
  </div>
</div>
