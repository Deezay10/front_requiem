<div class="uk-section uk-section-muted uk-flex uk-flex-middle uk-animation-fade" uk-height-viewport>
  <div class="uk-width-1-1">
    <div class="uk-container">
      <div class="uk-grid-margin uk-grid uk-grid-stack" uk-grid>
        <div class="uk-width-1-1@m">
          <div class="uk-margin uk-width-large uk-margin-auto uk-card uk-card-default uk-card-body uk-box-shadow-large">
            <h3 class="uk-card-title uk-text-center">Welcome back!</h3>
            <form>
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon"  uk-icon="icon: mail"></span>
                  <input class="uk-input uk-form-large" [(ngModel)]="this.email " name="email" type="text" placeholder="mail">
                </div>
              </div>
              <div class="uk-margin">
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="icon: lock"></span>
                  <input class="uk-input uk-form-large"[(ngModel)]="this.password" name="password" type="password" placeholder="password">
                </div>
              </div>
              <div class="uk-margin">
                <p style="color: lightgreen">{{this.message}}</p>
                <button class="uk-button uk-button-primary uk-button-large uk-width-1-1">Login</button>
              </div>
              <div class="uk-text-small uk-text-center">
                You forgot your password? <a class="uk-link"href="MdpOublie">Forgot password</a><br>
                Not registered? <a class="uk-link" href="inscription">Sign in</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
